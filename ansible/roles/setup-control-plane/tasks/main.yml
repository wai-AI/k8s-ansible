---
- name: Download API server and kubectl
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ kubernetes_version }}/bin/linux/amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    checksum: "sha256:https://dl.k8s.io/release/v{{ kubernetes_version }}/bin/linux/amd64/{{ item }}.sha256"
    mode: "0755"
    timeout: 120
  loop:
    - kube-apiserver
    - kubectl
  notify: Restart kube-apiserver

- name: Create Kubernetes configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /etc/kubernetes
    - /etc/kubernetes/pki

- name: Copy API server certificates and keys
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item }}"
    dest: "/etc/kubernetes/pki/{{ item }}"
    mode: "0600"
  loop:
    - ca.crt
    - kube-apiserver.crt
    - kube-apiserver.key
    - kube-apiserver-etcd-client.crt
    - kube-apiserver-etcd-client.key
    - kube-apiserver-kubelet-client.crt
    - kube-apiserver-kubelet-client.key
    - service-account.key
    - service-account.pub
  no_log: true
  notify: Restart kube-apiserver

- name: Copy internal administrator kubeconfig
  ansible.builtin.copy:
    src: "{{ kubeconfig_dir }}/admin-internal.kubeconfig"
    dest: /etc/kubernetes/admin.kubeconfig
    mode: "0600"
  no_log: true

- name: Copy encryption configuration
  ansible.builtin.copy:
    src: "{{ encryption_config_file }}"
    dest: /etc/kubernetes/encryption-config.yaml
    mode: "0600"
  no_log: true
  notify: Restart kube-apiserver

- name: Copy aggregation certificates and key
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item }}"
    dest: "/etc/kubernetes/pki/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - front-proxy-ca.crt
    - front-proxy-client.crt
    - front-proxy-client.key
  no_log: true
  notify: Restart kube-apiserver

- name: Install API server systemd unit
  ansible.builtin.template:
    src: kube-apiserver.service.j2
    dest: /etc/systemd/system/kube-apiserver.service
    mode: "0644"
  notify: Restart kube-apiserver

- name: Apply pending API server changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start API server
  ansible.builtin.systemd_service:
    name: kube-apiserver
    enabled: true
    state: started

- name: Wait for API server readiness
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig=/etc/kubernetes/admin.kubeconfig
      - --request-timeout=10s
      - get
      - --raw=/readyz
  register: api_readiness
  changed_when: false
  retries: 20
  delay: 3
  until: api_readiness.rc == 0 and api_readiness.stdout == 'ok'

- name: Show API server readiness
  ansible.builtin.debug:
    var: api_readiness.stdout

- name: Download controller manager and scheduler
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ kubernetes_version }}/bin/linux/amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    checksum: "sha256:https://dl.k8s.io/release/v{{ kubernetes_version }}/bin/linux/amd64/{{ item }}.sha256"
    mode: "0755"
    timeout: 120
  loop:
    - kube-controller-manager
    - kube-scheduler
  notify: Restart controller components

- name: Copy controller kubeconfigs
  ansible.builtin.copy:
    src: "{{ kubeconfig_dir }}/{{ item }}.kubeconfig"
    dest: "/etc/kubernetes/{{ item }}.kubeconfig"
    mode: "0600"
  loop:
    - kube-controller-manager
    - kube-scheduler
  no_log: true
  notify: Restart controller components

- name: Install controller systemd units
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    mode: "0644"
  loop:
    - kube-controller-manager
    - kube-scheduler
  notify: Restart controller components

- name: Apply pending controller changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start controller components
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - kube-controller-manager
    - kube-scheduler

- name: Create API server to kubelet authorization
  ansible.builtin.copy:
    dest: /etc/kubernetes/kubelet-rbac.yaml
    mode: "0644"
    content: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: kube-apiserver-kubelet-api-admin
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:kubelet-api-admin
      subjects:
        - kind: User
          name: kube-apiserver-kubelet-client
          apiGroup: rbac.authorization.k8s.io

- name: Apply API server to kubelet authorization
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig=/etc/kubernetes/admin.kubeconfig
      - apply
      - -f
      - /etc/kubernetes/kubelet-rbac.yaml
  register: kubelet_rbac
  changed_when: "'created' in kubelet_rbac.stdout or 'configured' in kubelet_rbac.stdout"

- name: Wait for controller leader leases
  ansible.builtin.command:
    argv:
      - /usr/local/bin/kubectl
      - --kubeconfig=/etc/kubernetes/admin.kubeconfig
      - -n
      - kube-system
      - get
      - lease
      - "{{ item }}"
      - -o
      - "jsonpath={.spec.holderIdentity}"
  loop:
    - kube-controller-manager
    - kube-scheduler
  register: controller_leases
  changed_when: false
  retries: 20
  delay: 3
  until: controller_leases.rc == 0 and controller_leases.stdout | length > 0

- name: Show controller leaders
  ansible.builtin.debug:
    msg: "{{ item.item }}: {{ item.stdout }}"
  loop: "{{ controller_leases.results }}"
  loop_control:
    label: "{{ item.item }}"
