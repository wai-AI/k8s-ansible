---
- name: Restart kube-apiserver
  ansible.builtin.systemd_service:
    name: kube-apiserver
    daemon_reload: true
    state: restarted

- name: Restart controller components
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    state: restarted
  loop:
    - kube-controller-manager
    - kube-scheduler
