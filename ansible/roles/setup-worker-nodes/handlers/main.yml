---
- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    daemon_reload: true
    state: restarted

- name: Restart worker services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    daemon_reload: true
    state: restarted
  loop:
    - kubelet
    - kube-proxy
