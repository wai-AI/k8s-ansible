apiVersion: v1
kind: Namespace
metadata:
  name: smoke-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smoke-test
  namespace: smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-server
  namespace: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-server
  template:
    metadata:
      labels:
        app: smoke-server
    spec:
      serviceAccountName: smoke-test
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: worker-1
      containers:
        - name: server
          image: busybox:1.37.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo smoke-ok > /www/index.html
              echo smoke-server-started
              exec httpd -f -p 8080 -h /www
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-server
  namespace: smoke-test
spec:
  selector:
    app: smoke-server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-client
  namespace: smoke-test
spec:
  serviceAccountName: smoke-test
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: worker-0
  containers:
    - name: client
      image: busybox:1.37.0
      command:
        - /bin/sh
        - -c
        - while true; do sleep 3600; done
---
apiVersion: v1
kind: Secret
metadata:
  name: encryption-check
  namespace: smoke-test
type: Opaque
data:
  value: c21va2UtdmFsdWU=
