---
- name: Create local PKI directory
  ansible.builtin.file:
    path: "{{ pki_dir }}"
    state: directory
    mode: "0700"

- name: Generate CA private key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/ca.key"
    type: RSA
    size: 4096
    mode: "0600"

- name: Generate CA certificate request
  community.crypto.openssl_csr:
    path: "{{ pki_dir }}/ca.csr"
    privatekey_path: "{{ pki_dir }}/ca.key"
    common_name: Kubernetes CA
    use_common_name_for_san: false
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
    mode: "0644"

- name: Generate self-signed CA certificate
  community.crypto.x509_certificate:
    path: "{{ pki_dir }}/ca.crt"
    csr_path: "{{ pki_dir }}/ca.csr"
    privatekey_path: "{{ pki_dir }}/ca.key"
    provider: selfsigned
    selfsigned_not_before: "-5m"
    selfsigned_not_after: "+3650d"
    ignore_timestamps: true
    mode: "0644"

- name: Generate component private keys
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/{{ item.name }}.key"
    type: RSA
    size: 2048
    mode: "0600"
  loop: "{{ k8s_certificates }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate component certificate requests
  community.crypto.openssl_csr:
    path: "{{ pki_dir }}/{{ item.name }}.csr"
    privatekey_path: "{{ pki_dir }}/{{ item.name }}.key"
    common_name: "{{ item.common_name }}"
    organization_name: "{{ item.organization | default(omit) }}"
    use_common_name_for_san: false
    subject_alt_name: "{{ item.subject_alt_name | default(omit) }}"
    basic_constraints:
      - "CA:FALSE"
    basic_constraints_critical: true
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage: "{{ item.extended_key_usage }}"
    mode: "0644"
  loop: "{{ k8s_certificates }}"
  loop_control:
    label: "{{ item.name }}"

- name: Sign component certificates with our CA
  community.crypto.x509_certificate:
    path: "{{ pki_dir }}/{{ item.name }}.crt"
    csr_path: "{{ pki_dir }}/{{ item.name }}.csr"
    provider: ownca
    ownca_path: "{{ pki_dir }}/ca.crt"
    ownca_privatekey_path: "{{ pki_dir }}/ca.key"
    ownca_not_before: "-5m"
    ownca_not_after: "+365d"
    ignore_timestamps: true
    mode: "0644"
  loop: "{{ k8s_certificates }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate ServiceAccount signing key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/service-account.key"
    type: RSA
    size: 2048
    mode: "0600"

- name: Extract ServiceAccount public key
  community.crypto.openssl_publickey:
    path: "{{ pki_dir }}/service-account.pub"
    privatekey_path: "{{ pki_dir }}/service-account.key"
    format: PEM
    mode: "0644"

- name: Generate front proxy CA private key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/front-proxy-ca.key"
    type: RSA
    size: 4096
    mode: "0600"

- name: Generate front proxy CA request
  community.crypto.openssl_csr:
    path: "{{ pki_dir }}/front-proxy-ca.csr"
    privatekey_path: "{{ pki_dir }}/front-proxy-ca.key"
    common_name: front-proxy-ca
    use_common_name_for_san: false
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
    mode: "0600"

- name: Generate front proxy CA certificate
  community.crypto.x509_certificate:
    path: "{{ pki_dir }}/front-proxy-ca.crt"
    csr_path: "{{ pki_dir }}/front-proxy-ca.csr"
    privatekey_path: "{{ pki_dir }}/front-proxy-ca.key"
    provider: selfsigned
    selfsigned_not_before: "-5m"
    selfsigned_not_after: "+3650d"
    ignore_timestamps: true
    mode: "0600"

- name: Generate front proxy client private key
  community.crypto.openssl_privatekey:
    path: "{{ pki_dir }}/front-proxy-client.key"
    type: RSA
    size: 2048
    mode: "0600"

- name: Generate front proxy client request
  community.crypto.openssl_csr:
    path: "{{ pki_dir }}/front-proxy-client.csr"
    privatekey_path: "{{ pki_dir }}/front-proxy-client.key"
    common_name: front-proxy-client
    use_common_name_for_san: false
    basic_constraints:
      - "CA:FALSE"
    basic_constraints_critical: true
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - clientAuth
    mode: "0600"

- name: Sign front proxy client certificate
  community.crypto.x509_certificate:
    path: "{{ pki_dir }}/front-proxy-client.crt"
    csr_path: "{{ pki_dir }}/front-proxy-client.csr"
    provider: ownca
    ownca_path: "{{ pki_dir }}/front-proxy-ca.crt"
    ownca_privatekey_path: "{{ pki_dir }}/front-proxy-ca.key"
    ownca_not_before: "-5m"
    ownca_not_after: "+365d"
    ignore_timestamps: true
    mode: "0600"
