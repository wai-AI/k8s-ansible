---
- name: Prepare nodes for Kubernetes
  hosts: k8s
  become: true
  gather_facts: true

  tasks:
    - name: Preserve hostnames across EC2 reboots
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-kubernetes-hostname.cfg
        content: "preserve_hostname: true\n"
        mode: "0644"

    - name: Configure local hostname resolution
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: Set hostname from inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - openssl
          - conntrack
          - iptables
          - chrony
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Enable time synchronization
      ansible.builtin.systemd_service:
        name: chrony
        enabled: true
        state: started

    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb | int > 0

    - name: Disable swap after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Configure kernel modules to load at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load kernel modules now
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Configure kernel networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
      notify: Apply kernel networking settings

  handlers:
    - name: Apply kernel networking settings
      ansible.builtin.command: sysctl --system
      changed_when: true

- name: Generate Kubernetes certificates locally
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  roles:
    - generate-certs
    - generate-configs

- name: Bootstrap etcd
  hosts: etcd
  become: true
  gather_facts: false

  roles:
    - bootstrap-etcd

- name: Bootstrap Kubernetes control plane
  hosts: control_plane
  become: true
  gather_facts: false

  roles:
    - setup-control-plane

- name: Bootstrap Kubernetes workers
  hosts: workers
  become: true
  gather_facts: false

  roles:
    - setup-worker-nodes

- name: Configure remote kubectl access
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  roles:
    - configure-kubectl

- name: Configure Kubernetes Pod networking
  hosts: control_plane
  become: true
  gather_facts: false

  roles:
    - setup-networking

- name: Run Kubernetes smoke tests
  hosts: control_plane
  become: true
  gather_facts: false
  tags:
    - smoke-test
  vars:
    smoke_kubectl: /usr/local/bin/kubectl --kubeconfig=/etc/kubernetes/admin.kubeconfig
  roles:
    - smoke-test
